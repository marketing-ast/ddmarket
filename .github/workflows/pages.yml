name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test catalog and category automation
        run: |
          node --test tests/site_catalog.test.mjs
          python3 -m venv "$RUNNER_TEMP/ddmarket-bot-tests"
          "$RUNNER_TEMP/ddmarket-bot-tests/bin/pip" install -r requirements-bot.txt
          "$RUNNER_TEMP/ddmarket-bot-tests/bin/python" -B -m unittest discover -s tests -p 'test_*.py'

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
